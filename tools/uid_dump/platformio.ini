; Standalone project for the UID helper sketch.
;
;   pio run -d tools/uid_dump -t upload
;   pio device monitor -b 9600
;
; In the Arduino IDE, just open uid_dump.ino and upload it as normal.

[platformio]
src_dir = .

[env:uid_dump]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
lib_deps = miguelbalboa/MFRC522@^1.4.11
