; PlatformIO config - used only as a compile check / upload path.
; The sketch is a plain Arduino IDE project: open br-math-device.ino directly
; and it will build there too (install "MFRC522" and "LiquidCrystal I2C" from
; the Library Manager first).
;
;   pio run             -> compile the game
;   pio run -t upload   -> flash the game
;
; The UID helper is a separate project (PlatformIO only converts .ino files at
; the project root), so it is built from its own folder:
;
;   pio run -d tools/uid_dump -t upload

[platformio]
src_dir = .

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
; Frank de Brabander's LiquidCrystal_I2C on purpose: it is the one installed in
; the Arduino IDE sketchbook, so building against it here means a green build is
; real evidence the Arduino IDE build works too. (The sketch also compiles against
; the other LiquidCrystal_I2C forks - see the #ifdef in setup().)
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    https://github.com/fdebrabander/Arduino-LiquidCrystal-I2C-library.git

[env:game]
build_src_filter = +<*> -<tools>
